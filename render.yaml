# Render Blueprint: one free web service running the Docker image
# (FastAPI API + built React app on the same URL).
services:
  - type: web
    name: ai-quiet-hours-scheduler
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret
      - key: ANTHROPIC_API_KEY
        sync: false # optional: paste your key in the Render dashboard to enable Claude
